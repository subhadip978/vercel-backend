version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: vercel_clone_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: vercel_clone
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d vercel_clone"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vercel_clone_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api-server:
    build:
      context: ./api-server
      target: builder # Use builder stage for dev to get ts-node-dev
    container_name: vercel_clone_api
    command: sh -c "npx prisma generate && npm run dev" 
    ports:
      - "8800:8800"
    volumes:
      - ./api-server:/usr/src/app
      - /usr/src/app/node_modules
      - /var/run/docker.sock:/var/run/docker.sock # Mount Docker socket for raw Daemon access
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/vercel_clone?schema=public
      - REDIS_URL=redis://redis:6379
      - ACCESSKEY=local_dummy
      - SECRETKEY=local_dummy
      - DOCKER_NETWORK=vercelserver_default
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  s3-reverse-proxy:
    build:
      context: ./s3-reverse-proxy
      target: builder
    container_name: vercel_clone_proxy
    command: npm run dev
    ports:
      - "8000:8000"
    volumes:
      - ./s3-reverse-proxy:/usr/src/app
      - /usr/src/app/node_modules

volumes:
  pgdata:
  redisdata:
